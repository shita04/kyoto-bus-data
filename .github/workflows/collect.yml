name: collect

# 車両位置（混雑）と遅延（TripUpdates）を、1本のワークフローでまとめて集める。
#
# 動き方（A'：自分で次の回を予約する）
#   1. 起動されたら約2時間、2分おきに取得し、30分ごとに保存する
#   2. 終わったら、自分で次の回を起動する（リレーのように途切れず続く）
#   3. 夜中（0時〜5時）に起動された回は、朝5時まで待ってから次の回を起動する
#   ※定期実行（schedule）は、リレーが切れたときに再開させる「保険」として残す
#
# なぜこうするのか：
#   GitHub の定期実行は混雑時に大きく間引かれる（公式ドキュメントに記載あり）。
#   10分おき・30分おきを指定しても、実際には4〜7時間おきにしか起動されなかった。
#   一方、GITHUB_TOKEN から起こした workflow_dispatch は必ず新しい実行を作ると
#   公式に書かれているため、終わりぎわに自分で次を起動すれば途切れない。

on:
  # 保険用の定期実行。cron は UTC（20-23,0-14 は日本時間の 05:00〜23:59）。
  # 毎時0分は混んで遅れやすいと公式にあるため、17分・47分にずらしている。
  schedule:
    - cron: "17,47 20-23,0-14 * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "保存の回数（本番 4。試験なら 1）"
        default: "4"
      samples:
        description: "1回あたりの取得回数（本番 15。試験なら 2）"
        default: "15"
      chain:
        description: "終わったら次の回を起動するか（本番 yes。試験なら no）"
        default: "yes"

permissions:
  contents: write   # 集めたデータをコミットするため
  actions: write    # 次の回を起動するため

# 同時に動くのは1回だけ。待ちが重なったら古い待ちは「Cancelled（灰色）」になるが異常ではない
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    # 2026-10-04 Ubuntu 26 への自動切替を避けるため固定。24.04 の提供終了予告が出たら見直す
    runs-on: ubuntu-24.04
    timeout-minutes: 330   # 夜中に起動された回は最大5時間待つため
    steps:
      - uses: actions/checkout@v7

      - name: 夜中なら朝5時まで待つ
        id: night
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          h=$((10#$(TZ=Asia/Tokyo date +%H)))
          if [ "$h" -lt 5 ]; then
            wait=$(( $(TZ=Asia/Tokyo date -d 'today 05:00' +%s) - $(date +%s) ))
            echo "夜中（日本時間 ${h} 時）のため、朝5時まで ${wait} 秒待ちます"
            sleep "$wait"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.night.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - run: pip install gtfs-realtime-bindings
        if: steps.night.outputs.skip != 'true'

      - name: 収集と保存（30分ごとに保存）
        if: steps.night.outputs.skip != 'true'
        env:
          ODPT_KEY: ${{ secrets.ODPT_KEY }}
          ROUNDS: ${{ inputs.rounds || '4' }}
          SAMPLES: ${{ inputs.samples || '15' }}
          INTERVAL: "120"
        run: |
          git config user.name "collector"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p data data_delay
          worked=0   # 収集が1度でも正常に終わったか（鍵の消失などで全滅したら赤くする）

          for round in $(seq 1 "$ROUNDS"); do
            echo "=== ${round} / ${ROUNDS} 回目 ==="

            # 車両位置と遅延を同時に集める。片方が失敗しても、もう片方は続ける
            # 直前のデータ保存の時刻（collect.py が「前の起動と同じ便」を数えないために使う）
            PREV_SAVE_AT=$(git log -1 --format=%ct -- data 2>/dev/null) python collect.py & p1=$!
            python collect_delay.py & p2=$!
            if wait "$p1"; then worked=1; else echo "[warn] collect.py が失敗しました"; fi
            if wait "$p2"; then worked=1; else echo "[warn] collect_delay.py が失敗しました"; fi

            # この回の分を保存して送る
            git add data data_delay
            if git diff --staged --quiet; then
              echo "変更なし"
            else
              git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3; do
                if git pull --rebase --autostash && git push; then break; fi
                echo "[warn] push に失敗（${i}回目）。10秒後にやり直します"
                sleep 10
              done
            fi

            # 次の回の最初の取得が、この回の最後と同じ内容にならないよう間をあける
            if [ "$round" -lt "$ROUNDS" ]; then sleep "$INTERVAL"; fi
          done

          # 全滅していたら失敗として知らせる（このときは次の回も起動しない）
          if [ "$worked" = 0 ]; then
            echo "!! 車両位置・遅延のどちらの収集も正常に終わりませんでした" && exit 1
          fi

          # 送れていないコミットが残っていないか確かめる
          git fetch -q origin
          if [ -n "$(git log '@{u}..HEAD' --oneline)" ]; then
            echo "!! 送れていないコミットがあります" && exit 1
          fi
          echo "完了"

      - name: 次の回を起動する
        # 成功したときだけ。手動の試験（chain = no）では起動しない
        if: success() && inputs.chain != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ steps.night.outputs.start }}
          SKIP: ${{ steps.night.outputs.skip }}
        run: |
          elapsed=$(( $(date +%s) - START ))
          # 安全装置：収集した回なのに10分未満で終わったなら、何かおかしいので連鎖を止める
          # （短い間隔で起動を繰り返す事故を防ぐ）
          if [ "$SKIP" != "true" ] && [ "$elapsed" -lt 600 ]; then
            echo "!! 実行が短すぎる（${elapsed} 秒）ため、次の回は起動しません" && exit 1
          fi
          gh workflow run collect.yml --ref "${GITHUB_REF_NAME}"
          echo "次の回を起動しました"
